name: Patch coach endpoint consolidation

on:
  push:
    branches:
      - feature/coach-ops-safety
    paths:
      - .github/workflows/patch-coach-endpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
          fetch-depth: 0
      - name: Route coach operations through ladder function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('coach-ops.js')
          text = path.read_text()
          old = '"/api/coach"'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 coach endpoint references, found {count}')
          path.write_text(text.replace(old, '"/api/ladder?mode=coach"'))
          PY
          node --check coach-ops.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-ops.js
          git commit -m "Route coach operations through ladder API"
          git push origin HEAD:feature/coach-ops-safety
