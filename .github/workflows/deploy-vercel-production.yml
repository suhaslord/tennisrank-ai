name: Deploy TennisRank production

on:
  workflow_run:
    workflows:
      - TennisRank production release gate
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "VERCEL_TOKEN is not available to the production deployment job." >&2
            echo "Add it as a repository secret or a secret in the GitHub production environment." >&2
            exit 1
          }

      - name: Link production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_4fHq5Px7I3sXJ9v8FOyXNOHD","projectId":"prj_p1VA7WLWT5fCRL4eep6DinNntvU1"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Stamp verified revision
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: printf '%s\n' "$VERIFIED_SHA" > release-sha.txt

      - name: Build verified source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify production alias contains the exact verified release
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE='https://tennisrank-ai.vercel.app'
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          ready=false
          for attempt in {1..12}; do
            bridge_code=$(curl --silent --show-error --location --output "$tmp/bridge" --write-out '%{http_code}' "$BASE/google-workbook-bridge.js" || true)
            workbook_code=$(curl --silent --show-error --output "$tmp/workbook" --write-out '%{http_code}' "$BASE/api/sheet-workbook?url=not-a-url" || true)
            sha_code=$(curl --silent --show-error --location --output "$tmp/release-sha" --write-out '%{http_code}' "$BASE/release-sha.txt" || true)
            deployed_sha=$(tr -d '\r\n' < "$tmp/release-sha" 2>/dev/null || true)
            if [ "$bridge_code" = '200' ] \
              && grep -q 'google-full-workbook-v1' "$tmp/bridge" \
              && [ "$workbook_code" = '400' ] \
              && [ "$sha_code" = '200' ] \
              && [ "$deployed_sha" = "$VERIFIED_SHA" ]; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != 'true' ]; then
            echo "Production alias did not expose verified revision $VERIFIED_SHA." >&2
            echo "Observed deployed revision: ${deployed_sha:-missing}." >&2
            exit 1
          fi
          echo "Verified production alias is serving revision $VERIFIED_SHA with the workbook bridge and workbook API."
