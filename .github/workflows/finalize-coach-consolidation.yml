name: Finalize coach endpoint consolidation

on:
  push:
    branches:
      - feature/coach-ops-safety
    paths:
      - .github/workflows/finalize-coach-consolidation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
          fetch-depth: 0
      - name: Consolidate tests and guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/coach-core-qa.yml')
          text = workflow.read_text()
          old = '          node --check api/coach.js\n'
          new = '          node --check lib/coach-dashboard.js\n'
          if old not in text:
              raise SystemExit('coach API syntax check marker missing')
          workflow.write_text(text.replace(old, new, 1))

          spec = Path('qa/coach-ops-browser.spec.js')
          text = spec.read_text()
          marker = "    if (path === '/api/ladder') return reply({\n"
          inject = "    if (path === '/api/ladder' && url.searchParams.get('mode') === 'coach' && req.method() === 'GET') return reply(dashboard());\n    if (path === '/api/ladder' && url.searchParams.get('mode') === 'coach' && req.method() === 'POST') { undoCalls += 1; return reply({ ok: true, dashboard: dashboard() }); }\n" + marker
          if marker not in text:
              raise SystemExit('ladder browser mock marker missing')
          text = text.replace(marker, inject, 1)
          old_get = "    if (path === '/api/coach' && req.method() === 'GET') return reply(dashboard());\n"
          old_post = "    if (path === '/api/coach' && req.method() === 'POST') { undoCalls += 1; return reply({ ok: true, dashboard: dashboard() }); }\n"
          if old_get not in text or old_post not in text:
              raise SystemExit('legacy coach browser mock marker missing')
          text = text.replace(old_get, '', 1).replace(old_post, '', 1)
          spec.write_text(text)
          PY
          node --check qa/coach-ops-browser.spec.js
          node --check lib/coach-dashboard.js
          node --check api/ladder.js

      - name: Remove redundant endpoint and temporary workflows
        run: |
          git rm api/coach.js
          git rm .github/workflows/patch-coach-endpoint.yml
          git rm .github/workflows/finalize-coach-consolidation.yml

      - name: Verify function budget
        run: |
          COUNT=$(find api -type f -name '*.js' | wc -l)
          echo "Serverless function candidates after consolidation: $COUNT"
          test "$COUNT" -le 12

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/coach-core-qa.yml qa/coach-ops-browser.spec.js
          git commit -m "Consolidate coach operations into ladder API"
          git push origin HEAD:feature/coach-ops-safety
