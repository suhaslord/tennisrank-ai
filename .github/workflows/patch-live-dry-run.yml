name: Patch Live Dry Run Pair Order
on:
  push:
    branches: [feature/coach-ops-safety]
    paths: ['.github/workflows/patch-live-dry-run.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
      - name: Make recovery doubles assertion pair-order insensitive
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/live-coach-production.spec.js')
          s=p.read_text()
          old="expect(recoveryRankings.some(x => x.name === 'QA Pair Three & QA Pair Four' && x.division === 'doubles')).toBeTruthy();"
          new="expect(recoveryRankings.some(x => x.division === 'doubles' && x.name.includes('QA Pair Three') && x.name.includes('QA Pair Four'))).toBeTruthy();"
          if old not in s:
              raise SystemExit('girls doubles assertion not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/live-coach-production.spec.js
          git diff --cached --quiet && exit 0
          git commit -m 'qa: assert doubles membership independent of pair order'
          git push origin HEAD:feature/coach-ops-safety
