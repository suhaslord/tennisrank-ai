name: Patch Live Dry Run Exact Restore
on:
  push:
    branches: [feature/coach-ops-safety]
    paths: ['.github/workflows/patch-live-dry-run.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
      - name: Target the exact messy import snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/live-coach-production.spec.js')
          s=p.read_text()
          old1="""    await publishPreview(page);\n\n    const messyCalc = await page.evaluate(async () => {"""
          new1="""    await publishPreview(page);\n    const messyHistory = await api(page, '/api/records?mode=history');\n    expect(messyHistory.status).toBe(200);\n    const messySnapshotId = messyHistory.body.snapshots?.[0]?.id;\n    expect(messySnapshotId).toBeTruthy();\n\n    const messyCalc = await page.evaluate(async () => {"""
          old2="""    await page.locator('#refreshImportHistory').click();\n    const restoreButton = page.locator('#importHistoryList [data-restore-import]').first();\n    await expect(restoreButton).toBeVisible({ timeout: 12000 });\n    await restoreButton.click();"""
          new2="""    await page.locator('#refreshImportHistory').click();\n    const restoreButton = page.locator(`#importHistoryList [data-restore-import=\"${messySnapshotId}\"]`);\n    await expect(restoreButton).toBeVisible({ timeout: 12000 });\n    await restoreButton.click();"""
          if old1 not in s: raise SystemExit('messy publish capture anchor not found')
          if old2 not in s: raise SystemExit('restore block not found')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/live-coach-production.spec.js
          git diff --cached --quiet && exit 0
          git commit -m 'qa: restore exact prior import snapshot'
          git push origin HEAD:feature/coach-ops-safety
