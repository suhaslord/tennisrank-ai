name: Patch Live Dry Run Assertion
on:
  push:
    branches: [feature/coach-ops-safety]
    paths: ['.github/workflows/patch-live-dry-run.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
      - name: Patch canonical doubles assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/live-coach-production.spec.js')
          s=p.read_text()
          s=s.replace("expect(messyCalc.some(x => x.name === 'Aiden Shah / Leo Kim' && x.division === 'doubles')).toBeTruthy();", "expect(messyCalc.some(x => x.name === 'Aiden Shah & Leo Kim' && x.division === 'doubles')).toBeTruthy();")
          s=s.replace("expect(messyCalc.some(x => x.name === 'Mateo Ruiz + Ethan Park' && x.division === 'doubles')).toBeTruthy();", "expect(messyCalc.some(x => x.name === 'Ethan Park & Mateo Ruiz' && x.division === 'doubles')).toBeTruthy();")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/live-coach-production.spec.js
          git diff --cached --quiet && exit 0
          git commit -m 'qa: assert canonical doubles team integrity'
          git push origin HEAD:feature/coach-ops-safety
