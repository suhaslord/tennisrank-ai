name: Patch app preview hook

on:
  push:
    branches:
      - feature/coach-ops-safety
    paths:
      - .github/workflows/patch-app-preview-hook.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
          fetch-depth: 0
      - name: Add authoritative preview hook to app publish function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '''async function syncToBackend(rows = state.rows) {
            if (state.profile?.role !== "admin") throw new Error("Only an admin can publish team data.");'''
          new = '''async function syncToBackend(rows = state.rows) {
            if (state.profile?.role !== "admin") throw new Error("Only an admin can publish team data.");
            if (window.TennisRankCoachOps?.previewAndPublish) return window.TennisRankCoachOps.previewAndPublish(window, rows);'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one syncToBackend marker, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Gate admin publishes through import preview"
          git push origin HEAD:feature/coach-ops-safety
