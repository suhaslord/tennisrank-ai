name: Coach Lokesh core flow QA

on:
  push:
    branches:
      - feature/coach-lokesh-core-flow
      - feature/coach-ops-safety
      - feature/player-insights-sharing
  workflow_dispatch:

concurrency:
  group: coach-core-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install spreadsheet test engine
        run: npm install --no-save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

      - name: Syntax check core flow
        run: |
          set -euo pipefail
          node --check ranking-policy.js
          node --check player-dashboard-state.js
          node --check player-insights.js
          node --check coach-sharing.js
          node --check import-auto-sync.js
          node --check coach-ops.js
          node --check coach-preview-guard.js
          node --check lib/player-link.js
          node --check lib/ladder-engine.js
          node --check lib/coach-dashboard.js
          node --check api/users.js
          node --check api/records.js
          node --check api/ladder.js
          node --check api/challenges.js
          node --check api/admin/seed-ladder.js
          node --check api/render.js
          node --check qa/ranking-policy.test.js
          node --check qa/player-dashboard-state.test.js
          node --check qa/player-insights.test.js
          node --check qa/coach-sharing.test.js
          node --check qa/player-link.test.js
          node --check qa/roster-metadata.test.js
          node --check qa/render-rewrite.test.js
          node --check qa/coach-ops.test.js
          node --check qa/ugly-import-regression.test.js
          node --check qa/core-flow-browser.spec.js
          node --check qa/coach-ops-browser.spec.js

      - name: Coach requirements unit tests
        run: |
          set -euo pipefail
          node qa/ranking-policy.test.js
          node qa/player-dashboard-state.test.js
          node qa/player-insights.test.js
          node qa/coach-sharing.test.js
          node qa/player-link.test.js
          node qa/roster-metadata.test.js
          node qa/render-rewrite.test.js
          node qa/ladder-engine.test.js
          node qa/challenge-api.test.js
          node qa/coach-ops.test.js

      - name: Import regression suite
        run: |
          set -euo pipefail
          node qa/import-regression.test.js
          node qa/import-v2.test.js
          node qa/import-v2-diagnostics.js
          node qa/delimiter-fuzz.test.js
          node qa/row-safety.test.js
          node qa/multiblock.test.js
          node qa/workbook-formats.test.js
          node qa/sheet-proxy.test.js
          node qa/spreadsheet-ml.test.js
          node qa/spreadsheet-ml-benchmark.test.js
          node qa/spreadsheet-ai.test.js
          node qa/import-auto-sync.test.js
          node qa/ugly-import-regression.test.js

      - name: Deployment and security guardrails
        run: |
          set -euo pipefail
          test -f lib/player-link.js
          test -f coach-ops.js
          test -f coach-ops.css
          test -f coach-preview-guard.js
          test -f player-insights.js
          test -f coach-sharing.js
          test -f insights.css
          test -f supabase/coach_ops_import_history.sql
          test -f supabase/fix_challenge_undo_player_availability.sql
          test ! -e api/_player-link.js
          test ! -e lib/server-player-link.js
          grep -q '../lib/player-link' api/users.js
          grep -q '../lib/player-link' api/ladder.js
          grep -q '../lib/player-link' api/challenges.js
          grep -q '../lib/coach-dashboard' api/ladder.js
          grep -q 'ranking-policy.js' api/render.js
          grep -q 'player-dashboard-state.js' api/render.js
          grep -q 'player-insights.js' api/render.js
          grep -q 'coach-sharing.js' api/render.js
          grep -q 'insights.css' api/render.js
          grep -q 'player-dashboard-state.css' api/render.js
          grep -q 'coach-ops.js' api/render.js
          grep -q 'coach-ops.css' api/render.js
          grep -q 'coach-preview-guard.js' api/render.js
          grep -q 'gradeLevel' api/admin/seed-ladder.js
          grep -q 'division' api/admin/seed-ladder.js
          grep -q 'metadata_preserved' supabase/ladder_roster_metadata.sql
          grep -q 'import_snapshots' supabase/coach_ops_import_history.sql
          grep -q 'ladder_snapshots' supabase/coach_ops_import_history.sql
          grep -q 'admin_undo_ladder_snapshot' supabase/coach_ops_import_history.sql
          grep -q "set status = 'available'" supabase/fix_challenge_undo_player_availability.sql
          COUNT=$(find api -type f -name '*.js' | wc -l)
          echo "Serverless function candidates: $COUNT"
          test "$COUNT" -le 12
          ! grep -R --exclude-dir=.git --exclude=.env.example -E 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' .
          ! grep -R --exclude-dir=.git --exclude=.env.example -E 'GEMINI_API_KEY[[:space:]]*=' .
          ! grep -R --exclude-dir=.git -E 'sb_secret_[A-Za-z0-9_-]+' .

      - name: Build browser QA runtimes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text()
          common = source.replace('</head>', '<link rel="stylesheet" href="./player-dashboard-state.css" /><link rel="stylesheet" href="./insights.css" /></head>')
          common_stack = '<script src="./import-runtime-fixes.js"></script><script src="./import-v2.js"></script><script src="./import-delimiter-fix.js"></script><script src="./spreadsheet-ml.js"></script><script src="./import-v2-fixes.js"></script><script src="./import-row-safety-fix.js"></script><script src="./import-multiblock-fix.js"></script><script src="./spreadsheet-semantic-calibration.js"></script><script src="./spreadsheet-ai.js"></script><script src="./ai-quota-guard.js"></script><script src="./import-auto-sync.js"></script><script src="./ranking-policy.js"></script><script src="./player-dashboard-state.js"></script><script src="./player-insights.js"></script>'
          common = common.replace('<script src="./app.js"></script>', '<script src="./app.js"></script>' + common_stack)
          Path('index.html').write_text(common)
          Path('qa-ai-index.html').write_text(common)

          coach = common.replace('</head>', '<link rel="stylesheet" href="./coach-ops.css" /></head>')
          coach = coach.replace('</body>', '<script src="./coach-ops.js"></script><script src="./coach-sharing.js"></script><script src="./coach-preview-guard.js"></script></body>')
          Path('qa-coach-index.html').write_text(coach)
          PY

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0

      - name: Browser regression QA
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -m http.server 4173 >/tmp/tennisrank-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npx playwright test qa/auth-flow.spec.js qa/browser.spec.js qa/ai-import.spec.js qa/import-board-sync.spec.js qa/core-flow-browser.spec.js qa/coach-ops-browser.spec.js --reporter=line --workers=1

      - name: Build visual QA shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          html = html.replace('</head>', '<link rel="stylesheet" href="./production-stability.css"><link rel="stylesheet" href="./tesla-authority.css"><link rel="stylesheet" href="./tesla-finish.css"><link rel="stylesheet" href="./tesla-motion.css"><link rel="stylesheet" href="./story-photo-scale.css"><link rel="stylesheet" href="./insights.css"><style>#showBootstrap,.bootstrap-form{display:none!important}</style></head>')
          html = html.replace('<script src="./ladder.js"></script>', '<script src="./tesla-motion.js"></script><script src="./brand-assets.js"></script><script src="./ladder.js"></script>')
          html = html.replace('<div class="cursor-ball" aria-hidden="true"><span class="cursor-ball-core"></span></div>', '')
          Path('qa-index.html').write_text(html)
          PY

      - name: Visual stability QA
        env:
          QA_BASE: http://127.0.0.1:4174/qa-index.html
        run: |
          set -euo pipefail
          python3 -m http.server 4174 >/tmp/tennisrank-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npx playwright test qa/visual-stability.spec.js qa/brand-logo.spec.js qa/story-photo-scale.spec.js --reporter=line --workers=1
