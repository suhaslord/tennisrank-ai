name: Patch coach QA timing

on:
  push:
    branches:
      - feature/coach-ops-safety
    paths:
      - .github/workflows/patch-coach-qa-race.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
          fetch-depth: 0
      - name: Wait for post-publish official ladder sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qa/coach-ops-browser.spec.js')
          text = path.read_text()
          old = "  expect(seedCalls).toBeGreaterThan(0);"
          new = "  await expect.poll(() => seedCalls).toBeGreaterThan(0);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one seed assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)
          start = "  await page.waitForTimeout(350);\n  const diagnostics = await page.evaluate(() => ({\n"
          end = "  console.log('COACH_PREVIEW_DIAGNOSTICS', JSON.stringify({ previewCalls, ...diagnostics }));\n"
          if start in text and end in text:
              before, tail = text.split(start, 1)
              _, after = tail.split(end, 1)
              text = before + "  await expect.poll(() => previewCalls).toBe(1);\n" + after
          path.write_text(text)
          PY
          node --check qa/coach-ops-browser.spec.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/coach-ops-browser.spec.js
          git commit -m "Wait for official ladder sync in Coach browser QA"
          git push origin HEAD:feature/coach-ops-safety
