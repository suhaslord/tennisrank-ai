name: TennisRank production monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check exact production revision, workbook release assets, and critical APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://tennisrank-ai.vercel.app'
          EXPECTED_SHA=$(git rev-parse HEAD)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          fail_stale() {
            echo "Production is reachable but stale: $1" >&2
            echo "Expected current main revision: $EXPECTED_SHA" >&2
            exit 1
          }

          code=$(curl --retry 2 --retry-delay 2 --silent --show-error --location --output "$tmp/home" --write-out '%{http_code}' "$BASE/")
          test "$code" = '200'
          grep -q 'TennisRank AI' "$tmp/home"
          grep -q 'id="authGate"' "$tmp/home"
          grep -q '/brand-assets.js' "$tmp/home"

          code=$(curl --retry 2 --retry-delay 2 --silent --show-error --location --output "$tmp/release-sha" --write-out '%{http_code}' "$BASE/release-sha.txt")
          test "$code" = '200' || fail_stale "/release-sha.txt returned HTTP $code"
          DEPLOYED_SHA=$(tr -d '\r\n' < "$tmp/release-sha")
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
            git diff --quiet "$DEPLOYED_SHA..$EXPECTED_SHA" -- . ':(exclude).github/**' || fail_stale "production is $DEPLOYED_SHA"
            echo "Production SHA differs only by GitHub workflow/config changes; continuing."
          fi

          code=$(curl --retry 2 --retry-delay 2 --silent --show-error --location --output "$tmp/bridge" --write-out '%{http_code}' "$BASE/google-workbook-bridge.js")
          test "$code" = '200' || fail_stale "/google-workbook-bridge.js returned HTTP $code"
          grep -q 'TennisRankGoogleWorkbookBridge' "$tmp/bridge" || fail_stale 'Google workbook bridge marker is missing'
          grep -q 'google-full-workbook-universal-v2' "$tmp/bridge" || fail_stale 'Google workbook engine marker is missing'

          code=$(curl --retry 2 --retry-delay 2 --silent --show-error --output "$tmp/workbook" --write-out '%{http_code}' "$BASE/api/sheet-workbook?url=not-a-url")
          test "$code" = '400' || fail_stale "/api/sheet-workbook returned HTTP $code instead of 400 for an invalid URL"
          grep -Eq 'valid Google Sheet|standard Google Sheets' "$tmp/workbook" || fail_stale 'Workbook API validation response is missing'

          code=$(curl --retry 2 --retry-delay 2 --silent --show-error --output "$tmp/config" --write-out '%{http_code}' "$BASE/api/config")
          test "$code" = '200'
          grep -q 'supabaseUrl' "$tmp/config"

          code=$(curl --silent --show-error --output "$tmp/records" --write-out '%{http_code}' "$BASE/api/records")
          test "$code" = '401'
          grep -q 'Sign in is required' "$tmp/records"

          code=$(curl --silent --show-error --output "$tmp/ladder" --write-out '%{http_code}' "$BASE/api/ladder")
          test "$code" = '401'
          grep -q 'Sign in is required' "$tmp/ladder"

          code=$(curl --silent --show-error --output "$tmp/sheet" --write-out '%{http_code}' "$BASE/api/sheet-proxy?url=not-a-url")
          test "$code" = '400'
          grep -q 'Invalid Google Sheets URL' "$tmp/sheet"

          echo "TennisRank production smoke checks passed for exact revision $EXPECTED_SHA."
