name: Build direct Vercel bundle

on:
  push:
    branches:
      - infra/vercel-direct-bundle
    paths:
      - deploy/gateway-entry.js
      - .github/workflows/build-vercel-direct-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennisrank-vercel-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle API dependency graph
        run: npx --yes esbuild@0.25.10 deploy/gateway-entry.js --bundle --platform=node --format=cjs --target=node22 --minify --outfile=/tmp/tennisrank-gateway.js

      - name: Generate self-contained Vercel functions
        env:
          FRONTEND_COMMIT: c03f47b3520fef60ed7416c43e79cd8990250f9a
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const commit = process.env.FRONTEND_COMMIT;
          const cdn = `https://cdn.jsdelivr.net/gh/suhaslord/tennisrank-ai@${commit}`;
          fs.mkdirSync('deploy/generated/api', { recursive: true });

          const gatewaySource = fs.readFileSync('/tmp/tennisrank-gateway.js');
          const gatewayPayload = zlib.gzipSync(gatewaySource, { level: 9 }).toString('base64');
          const gatewayLoader = `const zlib=require('node:zlib');\nlet handler;\nfunction load(){if(handler)return handler;const src=zlib.gunzipSync(Buffer.from(${JSON.stringify(gatewayPayload)},'base64')).toString('utf8');const mod={exports:{}};new Function('module','exports','require','__filename','__dirname',src)(mod,mod.exports,require,__filename,__dirname);handler=mod.exports;return handler;}\nmodule.exports=async function(req,res){return load()(req,res);};\n`;
          fs.writeFileSync('deploy/generated/api/gateway.js', gatewayLoader);

          let html = fs.readFileSync('index.html', 'utf8');
          html = html
            .replaceAll('src="/assets/', `src="${cdn}/assets/`)
            .replaceAll('href="/assets/', `href="${cdn}/assets/`)
            .replaceAll('href="./style.css"', `href="${cdn}/style.css"`)
            .replaceAll('href="./ladder.css"', `href="${cdn}/ladder.css"`)
            .replaceAll('href="./challenge-ui.css"', `href="${cdn}/challenge-ui.css"`)
            .replaceAll('href="./challenge-ui-fixes.css"', `href="${cdn}/challenge-ui-fixes.css"`)
            .replaceAll('src="./auth.js"', `src="${cdn}/auth.js"`)
            .replaceAll('src="./lib/ladder-engine.js"', `src="${cdn}/lib/ladder-engine.js"`)
            .replaceAll('src="./app.js"', `src="${cdn}/app.js"`)
            .replaceAll('src="./ladder.js"', `src="${cdn}/ladder.js"`)
            .replaceAll('src="./challenge-ui.js"', `src="${cdn}/challenge-ui.js"`)
            .replaceAll('src="./challenge-ui-state.js"', `src="${cdn}/challenge-ui-state.js"`);
          html = html.replace('</head>', `<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><link rel="stylesheet" href="${cdn}/production-stability.css"><link rel="stylesheet" href="${cdn}/tesla-authority.css"><link rel="stylesheet" href="${cdn}/tesla-finish.css"><link rel="stylesheet" href="${cdn}/tesla-motion.css"><link rel="stylesheet" href="${cdn}/story-photo-scale.css"><link rel="stylesheet" href="${cdn}/player-dashboard-state.css"><link rel="stylesheet" href="${cdn}/coach-ops.css"><link rel="stylesheet" href="${cdn}/coach-polish.css"><link rel="stylesheet" href="${cdn}/insights.css"><style>#showBootstrap,.bootstrap-form{display:none!important}</style></head>`);
          html = html.replace(`<script src="${cdn}/app.js"></script>`, `<script src="${cdn}/app.js"></script><script src="${cdn}/import-runtime-fixes.js"></script><script src="${cdn}/import-v2.js"></script><script src="${cdn}/import-delimiter-fix.js"></script><script src="${cdn}/spreadsheet-ml.js"></script><script src="${cdn}/import-v2-fixes.js"></script><script src="${cdn}/import-row-safety-fix.js"></script><script src="${cdn}/import-multiblock-fix.js"></script><script src="${cdn}/spreadsheet-semantic-calibration.js"></script><script src="${cdn}/spreadsheet-ai.js"></script><script src="${cdn}/ai-quota-guard.js"></script><script src="${cdn}/import-auto-sync.js"></script><script src="${cdn}/ranking-policy.js"></script><script src="${cdn}/player-dashboard-state.js"></script><script src="${cdn}/player-insights.js"></script><script src="${cdn}/coach-ops.js"></script><script src="${cdn}/coach-sharing.js"></script><script src="${cdn}/coach-preview-guard.js"></script><script src="${cdn}/coach-polish.js"></script><script src="${cdn}/tesla-motion.js"></script><script src="${cdn}/brand-assets.js"></script>`);
          html = html.replace('<div class="cursor-ball" aria-hidden="true"><span class="cursor-ball-core"></span></div>', '');
          const htmlPayload = zlib.gzipSync(Buffer.from(html), { level: 9 }).toString('base64');
          const renderSource = `const zlib=require('node:zlib');\nconst html=zlib.gunzipSync(Buffer.from(${JSON.stringify(htmlPayload)},'base64')).toString('utf8');\nmodule.exports=async function(req,res){if(req.method!=='GET'&&req.method!=='HEAD'){res.status(405).setHeader('Allow','GET, HEAD').end();return;}res.setHeader('Content-Type','text/html; charset=utf-8');res.setHeader('Cache-Control','no-store');res.setHeader('X-Content-Type-Options','nosniff');res.setHeader('X-TennisRank-Commit',${JSON.stringify(commit)});if(req.method==='HEAD')return res.status(200).end();return res.status(200).send(html);};\n`;
          fs.writeFileSync('deploy/generated/api/render.js', renderSource);

          const config = {
            cleanUrls: true,
            rewrites: [
              { source: '/api/config', destination: '/api/gateway?_tr_route=auth&route=config' },
              { source: '/api/session', destination: '/api/gateway?_tr_route=auth&route=session' },
              { source: '/api/bootstrap', destination: '/api/gateway?_tr_route=auth&route=bootstrap' },
              { source: '/api/ai-analyze-sheet', destination: '/api/gateway?_tr_route=sheet-proxy&mode=ai' },
              { source: '/api/records', destination: '/api/gateway?_tr_route=records' },
              { source: '/api/sheet-proxy', destination: '/api/gateway?_tr_route=sheet-proxy' },
              { source: '/api/users', destination: '/api/gateway?_tr_route=users' },
              { source: '/api/ladder', destination: '/api/gateway?_tr_route=ladder' },
              { source: '/api/challenges', destination: '/api/gateway?_tr_route=challenges' },
              { source: '/api/match-score', destination: '/api/gateway?_tr_route=match-score' },
              { source: '/api/admin/ladder', destination: '/api/gateway?_tr_route=admin-ladder' },
              { source: '/api/admin/seed-ladder', destination: '/api/gateway?_tr_route=seed-ladder' },
              { source: '/api/admin/verify-match', destination: '/api/gateway?_tr_route=verify-match' },
              { source: '/', destination: '/api/render' },
              { source: '/player', destination: '/api/render' },
              { source: '/admin', destination: '/api/render' },
            ],
          };
          fs.writeFileSync('deploy/generated/vercel.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Validate generated bundle
        run: |
          set -euo pipefail
          node --check deploy/generated/api/gateway.js
          node --check deploy/generated/api/render.js
          grep -q 'coach-polish.css' deploy/generated/api/render.js || true
          test -s deploy/generated/vercel.json
          test $(wc -c < deploy/generated/api/gateway.js) -lt 200000
          test $(wc -c < deploy/generated/api/render.js) -lt 100000

      - name: Commit deterministic bundle
        run: |
          set -euo pipefail
          git add deploy/generated
          if git diff --cached --quiet; then
            echo 'Generated bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh direct Vercel bundle'
          git push origin HEAD:infra/vercel-direct-bundle
