name: TennisRank hackathon preview

on:
  push:
    branches:
      - release/csc-final-2026-10-04
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Link preview project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_4fHq5Px7I3sXJ9v8FOyXNOHD","projectId":"prj_p1VA7WLWT5fCRL4eep6DinNntvU1"}' > .vercel/project.json
          npx --yes vercel@48.2.9 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$PREVIEW_SHA" > release-sha.txt
          npx --yes vercel@48.2.9 build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@48.2.9 deploy --prebuilt --token="$VERCEL_TOKEN" > preview-url.txt
          cat preview-url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tennisrank-preview-url
          path: preview-url.txt
