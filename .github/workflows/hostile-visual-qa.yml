name: TennisRank 500-state hostile visual QA

on:
  push:
    branches:
      - main
    paths:
      - qa/hostile-visual-matrix.spec.js
      - .github/workflows/hostile-visual-qa.yml
      - human-copy.js
      - ui-cohesion.js
      - ui-cohesion.css
      - review-fixes.css
      - layout-fix.css
      - ladder.js
      - account-settings.js
      - account-settings.css
      - coach-ops.js
      - coach-preview-guard.js
      - connected-sheet-guard.js
      - match-dedup-guard.js
      - coach-console-theme.css
      - challenge-ui.js
      - challenge-ui.css
      - challenge-ui-fixes.css
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennisrank-hostile-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hostile-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install visual QA dependencies
        run: npm install --no-save @playwright/test@1.55.0 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

      - name: Syntax check matrix
        run: |
          node --check human-copy.js
          node --check ui-cohesion.js
          node --check qa/hostile-visual-matrix.spec.js

      - name: Start QA app
        run: |
          mkdir -p qa-artifacts/hostile-matrix
          node qa/server.js >/tmp/tennisrank-hostile-http.log 2>&1 &
          echo $! > /tmp/tennisrank-hostile.pid
          sleep 2
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4173/qa-ai-index.html >/dev/null

      - name: Capture and validate 500 distinct app states
        run: npx playwright test qa/hostile-visual-matrix.spec.js --reporter=line --workers=1

      - name: Verify screenshot count
        if: always()
        run: |
          count=$(find qa-artifacts/hostile-matrix -type f -name '*.jpg' | wc -l | tr -d ' ')
          echo "Hostile visual screenshots: $count"
          test "$count" -eq 500

      - name: Save QA server log
        if: always()
        run: cp /tmp/tennisrank-hostile-http.log qa-artifacts/hostile-matrix/server.log || true

      - name: Upload all visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennisrank-hostile-visual-500-${{ github.sha }}
          path: qa-artifacts/hostile-matrix
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Stop QA app
        if: always()
        run: kill "$(cat /tmp/tennisrank-hostile.pid)" || true
