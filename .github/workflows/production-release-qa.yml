name: TennisRank production release gate

on:
  push:
    branches:
      - main
      - release/production-hardening-2026-09-12
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tennisrank-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-save @playwright/test@1.55.0 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

      - name: Syntax check production code
        run: |
          set -euo pipefail
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          for file in app.js auth.js coach-ops.js coach-sharing.js coach-preview-guard.js coach-polish.js google-workbook-bridge.js match-result-compat.js spreadsheet-universal.js import-certainty-gate.js import-auto-sync.js import-runtime-fixes.js import-v2.js spreadsheet-ai.js spreadsheet-ml.js ranking-policy.js player-dashboard-state.js player-insights.js; do
            node --check "$file"
          done
          node --check qa/production-hardening.test.js
          node --check qa/coach-feedback-regressions.test.js
          node --check qa/coach-failure-recovery.test.js
          node --check qa/account-access.test.js
          node --check qa/match-result-compat.test.js
          node --check qa/universal-import.test.js
          node --check qa/certainty-workbook.test.js
          node --check qa/connected-sheet-refresh.test.js
          node --check qa/certainty-ui.spec.js
          node --check qa/coach-real-sheet-browser.spec.js
          node --check qa/coach-failure-recovery.spec.js
          node --check qa/messy-form-factors.spec.js
          node --check qa/messy-player-charts.spec.js
          node --check qa/visual-stability.spec.js

      - name: Unit and import regression suite
        run: |
          set -euo pipefail
          node qa/ranking-policy.test.js
          node qa/player-dashboard-state.test.js
          node qa/player-insights.test.js
          node qa/coach-sharing.test.js
          node qa/player-link.test.js
          node qa/roster-metadata.test.js
          node qa/render-rewrite.test.js
          node qa/ladder-engine.test.js
          node qa/challenge-api.test.js
          node qa/coach-ops.test.js
          node qa/account-access.test.js
          node qa/coach-failure-recovery.test.js
          node qa/import-regression.test.js
          node qa/import-v2.test.js
          node qa/delimiter-fuzz.test.js
          node qa/row-safety.test.js
          node qa/multiblock.test.js
          node qa/workbook-formats.test.js
          node qa/sheet-proxy.test.js
          node qa/spreadsheet-ml.test.js
          node qa/spreadsheet-ml-benchmark.test.js
          node qa/spreadsheet-ai.test.js
          node qa/ai-thresholds.test.js
          node qa/import-auto-sync.test.js
          node qa/connected-sheet-refresh.test.js
          node qa/ugly-import-regression.test.js
          node qa/production-hardening.test.js
          node qa/import-reliability.test.js
          node qa/coach-feedback-regressions.test.js
          node qa/match-result-compat.test.js
          node qa/messy-charts.test.js
          node qa/universal-import.test.js
          node qa/certainty-workbook.test.js

      - name: Coach/browser strict path
        run: |
          set -euo pipefail
          node qa/server.js >/tmp/tennisrank-release-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npx playwright test \
            qa/auth-flow.spec.js \
            qa/browser.spec.js \
            qa/core-flow-browser.spec.js \
            qa/coach-ops-browser.spec.js \
            qa/coach-failure-recovery.spec.js \
            qa/import-board-sync.spec.js \
            qa/coach-real-sheet-browser.spec.js \
            qa/certainty-ui.spec.js \
            qa/messy-form-factors.spec.js \
            qa/messy-player-charts.spec.js \
            qa/visual-stability.spec.js \
            --reporter=line --workers=1

      - name: Deployment guardrails
        run: |
          set -euo pipefail
          test -f vercel.json
          test -f api/render.js
          test -f api/sheet-proxy.js
          test -f api/sheet-workbook.js
          test -f coach-polish.js
          test -f coach-polish.css
          test -f google-workbook-bridge.js
          test -f match-result-compat.js
          test -f spreadsheet-universal.js
          test -f import-certainty-gate.js
          grep -q 'coach-polish.css' api/render.js
          grep -q 'coach-polish.js' api/render.js
          grep -q 'match-result-compat.js' api/render.js
          grep -q 'import-certainty-gate.js' brand-assets.js
          grep -q 'google-workbook-bridge.js' brand-assets.js
          grep -q 'match-result-compat.js' brand-assets.js
          grep -q 'spreadsheet-universal.js' brand-assets.js
          grep -q 'CERTAINTY_THRESHOLD = 0.85' import-certainty-gate.js
          ! grep -R --exclude-dir=.git --exclude=.env.example -E 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' .
          ! grep -R --exclude-dir=.git --exclude=.env.example -E 'GEMINI_API_KEY[[:space:]]*=' .
