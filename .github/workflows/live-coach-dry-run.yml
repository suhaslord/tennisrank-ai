# live-rerun: recovery-pair-membership
name: Live Coach Dry Run
on:
  push:
    branches: [feature/coach-ops-safety]
    paths:
      - '.github/workflows/live-coach-dry-run.yml'
      - 'qa/live-coach-production.spec.js'

jobs:
  live-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run production coach dry run
        env:
          BASE_URL: https://tennisrank-ai.vercel.app
          QA_ADMIN_EMAIL: suhas.aug2011+tennisrank-qa-admin@gmail.com
          QA_ADMIN_PASSWORD: QA-Admin-TR-2026!x8N2
          BASELINE_SNAPSHOT_ID: 56c0c648-b5d8-47c4-aa68-fd27af0671ae
        run: npx playwright test qa/live-coach-production.spec.js --reporter=line --workers=1
