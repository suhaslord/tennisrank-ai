name: Patch coach ops syntax

on:
  push:
    branches:
      - feature/coach-ops-safety
    paths:
      - .github/workflows/patch-coach-ops-syntax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
          fetch-depth: 0
      - name: Fix malformed attention card template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('coach-ops.js')
          text = path.read_text()
          bad = 'class="coach-attention-card${urgent ? " is-urgent" : "}\\"><i'
          good = 'class="coach-attention-card${urgent ? " is-urgent" : ""}"><i'
          if bad not in text:
              raise SystemExit('Expected malformed template not found')
          path.write_text(text.replace(bad, good, 1))
          PY
          node --check coach-ops.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-ops.js
          git commit -m "Fix coach operations template syntax"
          git push origin HEAD:feature/coach-ops-safety
