name: Patch coach ops syntax

on:
  push:
    branches:
      - feature/coach-ops-safety
    paths:
      - .github/workflows/patch-coach-ops-syntax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-ops-safety
          fetch-depth: 0
      - name: Fix malformed attention card template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('coach-ops.js')
          text = path.read_text()
          bad = 'urgent ? " is-urgent" : "}'
          good = 'urgent ? " is-urgent" : ""}'
          if text.count(bad) != 1:
              raise SystemExit(f'Expected exactly one malformed ternary, found {text.count(bad)}')
          path.write_text(text.replace(bad, good, 1))
          PY
          node --check coach-ops.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-ops.js
          git commit -m "Fix coach operations template syntax"
          git push origin HEAD:feature/coach-ops-safety
